<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-shopizi.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shopizi — Le commerce digital au Burkina Faso</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A504A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shopizi" />
    <link rel="apple-touch-icon" href="/logo-shopizi.png" />

    <!-- SEO -->
    <meta name="description" content="Shopizi : la plateforme e-commerce du Burkina Faso. Creez votre boutique en ligne, vendez vos produits physiques et digitaux, et faites livrer partout au Faso." />
    <meta name="keywords" content="Shopizi, e-commerce Burkina Faso, boutique en ligne Burkina, vente en ligne Ouagadougou, commerce digital Faso, produits digitaux" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://shopizi-bf.vercel.app/" />

    <!-- Open Graph (apercu WhatsApp / Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shopizi" />
    <meta property="og:title" content="Shopizi — Le commerce digital au Burkina Faso" />
    <meta property="og:description" content="Creez votre boutique en ligne au Burkina Faso, vendez vos produits physiques et digitaux, et faites livrer partout au Faso." />
    <meta property="og:url" content="https://shopizi-bf.vercel.app/" />
    <meta property="og:image" content="https://shopizi-bf.vercel.app/logo-shopizi.png" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shopizi — Le commerce digital au Burkina Faso" />
    <meta name="twitter:description" content="Creez votre boutique en ligne au Burkina Faso, vendez vos produits physiques et digitaux, et faites livrer partout au Faso." />
    <meta name="twitter:image" content="https://shopizi-bf.vercel.app/logo-shopizi.png" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>

    <!-- Ecran de demarrage (splash) : visible uniquement quand l'app est lancee
         en mode installe (standalone), retire par main.tsx une fois React monte. -->
    <style>
      #app-splash { display: none; }
      @media (display-mode: standalone) {
        #app-splash {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #0A504A; transition: opacity .35s ease;
        }
      }
      #app-splash .tile {
        width: 104px; height: 104px; border-radius: 26px; background: #fff;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 40px rgba(0,0,0,.28);
      }
      #app-splash .tile img { width: 74px; height: 74px; object-fit: contain; }
      #app-splash .dots { display: flex; gap: 6px; margin-top: 22px; }
      #app-splash .dots span {
        width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.55);
        animation: splash-bounce 1s infinite ease-in-out;
      }
      #app-splash .dots span:nth-child(2) { animation-delay: .15s; }
      #app-splash .dots span:nth-child(3) { animation-delay: .3s; }
      @keyframes splash-bounce {
        0%, 80%, 100% { opacity: .3; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-6px); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="tile"><img src="/logo-shopizi.png" alt="Shopizi" /></div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
