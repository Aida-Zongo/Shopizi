<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#15803d"/>
      <stop offset="100%" style="stop-color:#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Fond cercle -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGrad)"/>

  <!-- Visage -->
  <circle cx="50" cy="42" r="22" fill="#FDBCB4"/>

  <!-- Cheveux -->
  <ellipse cx="50" cy="28" rx="22" ry="12" fill="#3d1a00"/>
  <ellipse cx="30" cy="36" rx="8" ry="14" fill="#3d1a00"/>
  <ellipse cx="70" cy="36" rx="8" ry="14" fill="#3d1a00"/>

  <!-- Yeux -->
  <circle cx="43" cy="40" r="3" fill="#3d1a00"/>
  <circle cx="57" cy="40" r="3" fill="#3d1a00"/>
  <circle cx="44" cy="39" r="1" fill="white"/>
  <circle cx="58" cy="39" r="1" fill="white"/>

  <!-- Sourire -->
  <path d="M 43 48 Q 50 54 57 48" stroke="#3d1a00"
    stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Corps -->
  <ellipse cx="50" cy="78" rx="20" ry="15" fill="#15803d"/>

  <!-- Collier traditionnel -->
  <path d="M 38 62 Q 50 68 62 62" stroke="#ca8a04"
    stroke-width="3" fill="none"/>

  <!-- Initiale K -->
  <text x="50%" y="82%"
    font-family="Arial" font-size="10" font-weight="bold"
    fill="white" text-anchor="middle">Kèra</text>
</svg>
