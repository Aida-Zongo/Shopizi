<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .faso-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23007A38' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .input-focus-ring:focus {
            border-color: #007A38 !important;
            box-shadow: 0 0 0 2px rgba(0, 122, 56, 0.1);
        }

        .strength-bar {
            transition: width 0.3s ease-in-out, background-color 0.3s ease-in-out;
        }
    </style>

<body class="bg-background font-body-md text-text-main min-h-screen flex items-center justify-center p-md faso-pattern">
<!-- Auth Container -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0px_10px_32px_rgba(0,0,0,0.06)] overflow-hidden relative border border-outline-variant/30">
<!-- Header Branding -->
<div class="pt-lg px-lg pb-md text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-burkina-green-light rounded-full mb-md">
<span class="material-symbols-outlined text-burkina-green-deep text-[32px]" data-icon="lock_reset">lock_reset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-text-main mb-xs">Nouveau mot de passe</h1>
<p class="font-body-md text-text-muted">Créez un mot de passe robuste pour sécuriser votre boutique Shopizi.</p>
</div>
<!-- Form Section -->
<form class="px-lg pb-lg space-y-md" id="resetForm">
<!-- Password Field -->
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface-variant" for="password">Nouveau mot de passe</label>
<div class="relative">
<input class="w-full h-12 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md input-focus-ring transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-text-muted hover:text-burkina-green-deep transition-colors" onclick="togglePassword('password')" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="eye-icon-password">visibility</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="mt-sm">
<div class="flex justify-between items-center mb-xs">
<span class="text-label-sm font-label-sm text-text-muted" id="strength-label">Force du mot de passe</span>
<span class="text-label-sm font-label-sm text-tertiary" id="strength-text">Très faible</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="strength-bar h-full w-[20%] bg-tertiary" id="strength-bar"></div>
</div>
<ul class="mt-sm space-y-1">
<li class="flex items-center gap-2 text-label-sm font-label-sm text-text-muted" id="req-length">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle">check_circle</span>
                            Au moins 8 caractères
                        </li>
<li class="flex items-center gap-2 text-label-sm font-label-sm text-text-muted" id="req-special">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle">check_circle</span>
                            Un caractère spécial (@, #, !, etc.)
                        </li>
</ul>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface-variant" for="confirm_password">Confirmer le mot de passe</label>
<div class="relative">
<input class="w-full h-12 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md input-focus-ring transition-all outline-none" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-text-muted hover:text-burkina-green-deep transition-colors" onclick="togglePassword('confirm_password')" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="eye-icon-confirm">visibility</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-sm space-y-sm">
<button class="w-full h-14 bg-secondary-container text-on-secondary-container font-label-lg text-label-lg rounded-lg shadow-sm hover:brightness-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Réinitialiser le mot de passe
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<a class="flex items-center justify-center w-full py-sm text-burkina-green-deep font-label-lg text-label-lg hover:underline transition-all" href="#">
                    Retour à la connexion
                </a>
</div>
</form>
<!-- Aesthetic Footer Motif -->
<div class="h-2 w-full bg-gradient-to-r from-burkina-green-deep via-secondary-container to-tertiary"></div>
</main>
<!-- Background Decorative Element -->
<div class="fixed -bottom-32 -left-32 w-96 h-96 bg-burkina-green-light rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
<div class="fixed -top-32 -right-32 w-96 h-96 bg-saffron-glow rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
<script>
        // Password Visibility Toggle
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId === 'password' ? 'eye-icon-password' : 'eye-icon-confirm');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Password Strength Logic
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strength-bar');
        const strengthText = document.getElementById('strength-text');
        const reqLength = document.getElementById('req-length');
        const reqSpecial = document.getElementById('req-special');

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let strength = 0;
            
            // Length check
            if (val.length >= 8) {
                strength += 1;
                reqLength.classList.remove('text-text-muted');
                reqLength.classList.add('text-burkina-green-deep');
                reqLength.querySelector('span').style.fontVariationSettings = "'FILL' 1";
            } else {
                reqLength.classList.add('text-text-muted');
                reqLength.classList.remove('text-burkina-green-deep');
                reqLength.querySelector('span').style.fontVariationSettings = "'FILL' 0";
            }

            // Special char check
            if (/[!@#$%^&*(),.?":{}|<>]/.test(val)) {
                strength += 1;
                reqSpecial.classList.remove('text-text-muted');
                reqSpecial.classList.add('text-burkina-green-deep');
                reqSpecial.querySelector('span').style.fontVariationSettings = "'FILL' 1";
            } else {
                reqSpecial.classList.add('text-text-muted');
                reqSpecial.classList.remove('text-burkina-green-deep');
                reqSpecial.querySelector('span').style.fontVariationSettings = "'FILL' 0";
            }

            // Add complexity points
            if (/[A-Z]/.test(val)) strength += 1;
            if (/[0-9]/.test(val)) strength += 1;

            // UI Update
            updateStrengthUI(strength, val.length);
        });

        function updateStrengthUI(score, length) {
            if (length === 0) {
                strengthBar.style.width = '0%';
                strengthText.textContent = 'Très faible';
                strengthBar.className = 'strength-bar h-full bg-tertiary';
                strengthText.className = 'text-label-sm font-label-sm text-tertiary';
                return;
            }

            if (score <= 1) {
                strengthBar.style.width = '25%';
                strengthBar.className = 'strength-bar h-full bg-tertiary';
                strengthText.textContent = 'Faible';
                strengthText.className = 'text-label-sm font-label-sm text-tertiary';
            } else if (score === 2) {
                strengthBar.style.width = '50%';
                strengthBar.className = 'strength-bar h-full bg-secondary-container';
                strengthText.textContent = 'Moyen';
                strengthText.className = 'text-label-sm font-label-sm text-secondary';
            } else if (score === 3) {
                strengthBar.style.width = '75%';
                strengthBar.className = 'strength-bar h-full bg-primary-fixed-dim';
                strengthText.textContent = 'Fort';
                strengthText.className = 'text-label-sm font-label-sm text-burkina-green-deep';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.className = 'strength-bar h-full bg-burkina-green-deep';
                strengthText.textContent = 'Très sécurisé';
                strengthText.className = 'text-label-sm font-label-sm text-burkina-green-deep';
            }
        }

        // Form Submit
        document.getElementById('resetForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;

            if (pass !== confirm) {
                alert("Les mots de passe ne correspondent pas !");
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Mise à jour...';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: \'FILL\' 1">check_circle</span> Succès';
                btn.classList.replace('bg-secondary-container', 'bg-burkina-green-deep');
                btn.classList.replace('text-on-secondary-container', 'text-white');
            }, 1500);
        });
    </script>
</body></html>
