# Blueprint Render — DOIT être à la racine du repo pour être auto-détecté.
# rootDir: api indique à Render où se trouve le code du backend (package.json).
services:
  - type: web
    name: shopizi-api
    env: node
    region: frankfurt
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # NE PAS fixer PORT : Render injecte son propre port (10000) et route
      # le trafic dessus. server.js lit process.env.PORT automatiquement.
      # Secrets JWT générés par Render (noms EXACTS lus par config/index.js).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # CORS_ORIGIN REQUIS : sinon l'API bloque le frontend Vercel.
      # Le domaine de prod Vercel réel est shopizi-bf.vercel.app.
      - key: CORS_ORIGIN
        value: https://shopizi-bf.vercel.app,https://shopizi.vercel.app
      - key: FRONTEND_URL
        value: https://shopizi-bf.vercel.app
      - key: BACKEND_URL
        value: https://shopizi-api.onrender.com
      # CinetPay : valeurs saisies dans le dashboard Render (sync: false),
      # jamais commitées. notify/return dérivent de BACKEND_URL/FRONTEND_URL.
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_BASE_URL
        value: https://api-checkout.cinetpay.net/v2
      # Cloudinary : héberge les fichiers des produits digitaux. Mêmes règles
      # que CinetPay — secrets saisis dans le dashboard Render, jamais commités.
      # La clé API doit avoir les permissions d'upload (actions "create"),
      # sinon toute publication de produit digital échoue en 403.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Connexion à la base Render (sinon pas de DATABASE_URL en prod).
      - key: DATABASE_URL
        fromDatabase:
          name: shopizi-db
          property: connectionString

databases:
  - name: shopizi-db
    plan: free
    region: frankfurt
