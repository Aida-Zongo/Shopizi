services:
  - type: web
    name: shopizi-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://shopizi.vercel.app
      # CORS_ORIGIN est REQUIS : sans lui, l'API retombe sur localhost:5173
      # (config/index.js) et bloque le frontend Vercel. Doit = FRONTEND_URL.
      - key: CORS_ORIGIN
        value: https://shopizi.vercel.app
      - key: BACKEND_URL
        value: https://shopizi-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: shopizi-db
          property: connectionString

databases:
  - name: shopizi-db
    plan: free
    region: frankfurt
